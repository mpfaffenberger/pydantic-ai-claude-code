name: Publish

# Push a `vX.Y.Z` tag matching `version` in pyproject.toml to test, build, and publish that release to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          # The job holds the PyPI token, so it never restores a cache another run could have written.
          enable-cache: false
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - run: uv sync --locked --extra dev --extra clai2
      - run: uv run pytest -q
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
