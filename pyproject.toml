[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-claude-code"
version = "0.6.2"
description = "Use your Claude Code subscription from a Pydantic AI Agent or CLAI2, with full tool support"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "keyring>=23,<26",
    "pydantic-ai-slim[anthropic]>=2.31.0,<3",
]
license = { text = "MIT" }
authors = [{ name = "Michael Pfaffenberger" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/mpfaffenberger/pydantic-ai-claude-code"
Homepage = "https://pypi.org/project/pydantic-claude-code/"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_claude_code"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[project.optional-dependencies]
# Only for installing the plugin as a package; the usual install copies the package folder into CLAI2's
# plugins folder. Either way it needs the class-based `Plugin` API, first released in 0.53.0:
# https://github.com/pydantic/pydantic-ai/pull/9493.
clai2 = ["pydantic-clai2>=0.53.0"]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
    "pyright>=1.1.400",
]

