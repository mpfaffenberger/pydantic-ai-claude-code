[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-claude-code"
version = "0.4.0"
description = "Use your Claude Code subscription from a Pydantic AI Agent or CLAI2, with full tool support"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "keyring>=23,<26",
    "pydantic-ai-slim[anthropic]>=2.31.0,<3",
]
license = { text = "MIT" }
authors = [{ name = "Michael Pfaffenberger" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/mpfaffenberger/pydantic-ai-claude-code"
Homepage = "https://pypi.org/project/pydantic-claude-code/"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_claude_code"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[project.optional-dependencies]
# Only for installing the plugin as a package; the usual install copies the package folder into CLAI2's
# plugins folder. Either way it needs `PluginHost.model_provider`, which 0.52.0 lacks:
# https://github.com/pydantic/pydantic-ai/pull/9468.
clai2 = ["pydantic-clai2>0.52.0"]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23.1",
    "ruff>=0.15,<0.16",
    "pyright>=1.1.400",
]

# Until a pydantic-clai2 release includes pydantic/pydantic-ai#9468, develop and test the plugin against its
# merge commit on main. CLAI2 pins Pydantic AI and the harness to its own build, so all four come from the same
# commit. Remove this
# table once a pydantic-clai2 release has `PluginHost.model_provider`.
[tool.uv.sources]
pydantic-clai2 = { git = "https://github.com/pydantic/pydantic-ai", rev = "65a8f8f78fe88fd6805c6a71069e1404ab461cc8", subdirectory = "src/pydantic_clai2" }
pydantic-ai-harness = { git = "https://github.com/pydantic/pydantic-ai", rev = "65a8f8f78fe88fd6805c6a71069e1404ab461cc8", subdirectory = "src/pydantic_ai_harness" }
pydantic-ai-slim = { git = "https://github.com/pydantic/pydantic-ai", rev = "65a8f8f78fe88fd6805c6a71069e1404ab461cc8", subdirectory = "pydantic_ai_slim" }
pydantic-graph = { git = "https://github.com/pydantic/pydantic-ai", rev = "65a8f8f78fe88fd6805c6a71069e1404ab461cc8", subdirectory = "pydantic_graph" }
